services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Split-URL fix - see ../run-sso-docker/docker-compose.yml
      KC_HOSTNAME: http://localhost:8095
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8095:8080"
    volumes:
      - ./realm:/opt/keycloak/data/import:ro

  cadenzaflow:
    build: .
    depends_on:
      - keycloak
    ports:
      - "8096:8080"
    restart: on-failure
