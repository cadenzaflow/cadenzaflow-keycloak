# Single instance: Keycloak SSO for the webapps AND token-claim RBAC on
# /engine-rest, in one JVM. The platform's oauth2 autoconfiguration (its
# login chain matches any request) is replaced by the example's scoped copy
# (sso-chain module) so it can coexist with the RBAC chain.

spring.autoconfigure.exclude:
  - org.cadenzaflow.bpm.spring.boot.starter.security.oauth2.CamundaSpringSecurityOAuth2AutoConfiguration

cadenzaflow.bpm:
  webapp:
    application-path: /cadenzaflow
  oauth2:
    identity-provider:
      enabled: false
    sso-logout:
      enabled: true
  authorization:
    enabled: true
  run:
    example:
      enabled: false
    process-engine-plugins:
      - plugin-class: org.cadenzaflow.bpm.extension.keycloak.plugin.KeycloakIdentityProviderPlugin
        plugin-parameters:
          keycloakIssuerUrl: http://keycloak:8080/realms/cadenzaflow
          keycloakAdminUrl: http://keycloak:8080/admin/realms/cadenzaflow
          clientId: cadenzaflow-webapps
          clientSecret: change-me-demo-secret
          useUsernameAsCamundaUserId: true
          administratorGroupName: cadenzaflow-admin

spring.datasource:
  url: jdbc:h2:./cadenzaflow-h2/process-engine;TRACE_LEVEL_FILE=0;DB_CLOSE_ON_EXIT=FALSE
  driver-class-name: org.h2.Driver
  username: sa
  password: sa

spring.web.resources:
  static-locations: NULL

spring.security.oauth2.client:
  registration:
    keycloak:
      provider: keycloak
      client-id: cadenzaflow-webapps
      client-secret: change-me-demo-secret
      scope: openid,profile,email
      authorization-grant-type: authorization_code
      redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
  provider:
    keycloak:
      authorization-uri: http://localhost:8095/realms/cadenzaflow/protocol/openid-connect/auth
      token-uri: http://keycloak:8080/realms/cadenzaflow/protocol/openid-connect/token
      jwk-set-uri: http://keycloak:8080/realms/cadenzaflow/protocol/openid-connect/certs
      user-info-uri: http://keycloak:8080/realms/cadenzaflow/protocol/openid-connect/userinfo
      user-name-attribute: preferred_username

# --- token-claim RBAC gate on /engine-rest (openid-rbac-security) ---
# "roles" = values of the token's "groups" claim (group-membership mapper on
# the client, see realm/cadenzaflow-realm.json).
opentmf:
  security:
    jwk-set-uri: http://keycloak:8080/realms/cadenzaflow/protocol/openid-connect/certs
    user-claim: preferred_username
    authorities-claim: groups
    secure-endpoints:
      - method: GET
        path: /engine-rest/**
        roles:
          - cadenzaflow-admin
          - accounting
      - method: POST
        path: /engine-rest/**
        roles:
          - cadenzaflow-admin
      - method: PUT
        path: /engine-rest/**
        roles:
          - cadenzaflow-admin
      - method: DELETE
        path: /engine-rest/**
        roles:
          - cadenzaflow-admin
    whitelist:
      - /
      - /error
