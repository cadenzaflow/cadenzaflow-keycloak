# Node 2 (rest): engine-rest gated by token-claim RBAC (openid-rbac-security,
# github.com/opentmf/openid-rbac-security). No oauth2 client registration on
# this node, so the SSO login chain never activates; the starter's
# permit-all fallback chain (which also matches any request) is excluded so
# the RBAC chain is the only one.

spring.autoconfigure.exclude:
  - org.cadenzaflow.bpm.spring.boot.starter.security.oauth2.CamundaBpmSpringSecurityDisableAutoConfiguration

cadenzaflow.bpm:
  authorization:
    enabled: true
  run:
    example:
      enabled: false
    process-engine-plugins:
      - plugin-class: org.cadenzaflow.bpm.extension.keycloak.plugin.KeycloakIdentityProviderPlugin
        plugin-parameters:
          keycloakIssuerUrl: http://keycloak:8080/realms/cadenzaflow
          keycloakAdminUrl: http://keycloak:8080/admin/realms/cadenzaflow
          clientId: cadenzaflow-webapps
          clientSecret: change-me-demo-secret
          useUsernameAsCamundaUserId: true
          administratorGroupName: cadenzaflow-admin

spring.datasource:
  url: jdbc:postgresql://postgres:5432/cadenzaflow
  driver-class-name: org.postgresql.Driver
  username: cadenzaflow
  password: cadenzaflow

spring.web.resources:
  static-locations: NULL

# --- token-claim RBAC gate (the opentmf-camunda7 model) ---
# "roles" = values of the token's "groups" claim (group-membership mapper on
# the client, see realm/cadenzaflow-realm.json).
opentmf:
  security:
    jwk-set-uri: http://keycloak:8080/realms/cadenzaflow/protocol/openid-connect/certs
    user-claim: preferred_username
    authorities-claim: groups
    secure-endpoints:
      - method: GET
        path: /engine-rest/**
        roles:
          - cadenzaflow-admin
          - accounting
      - method: POST
        path: /engine-rest/**
        roles:
          - cadenzaflow-admin
      - method: PUT
        path: /engine-rest/**
        roles:
          - cadenzaflow-admin
      - method: DELETE
        path: /engine-rest/**
        roles:
          - cadenzaflow-admin
    whitelist:
      - /error
