name: Build project with Maven
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # can be used to trigger the workflow manually

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    # The test suite talks to a real Keycloak. Version matches the
    # KeycloakContainer default in AbstractKeycloakIdentityProviderTest.
    - name: Start Keycloak
      run: |
        docker run -d \
          --name keycloak \
          -p 8080:8080 \
          -p 9000:9000 \
          -e KEYCLOAK_ADMIN=keycloak \
          -e KEYCLOAK_ADMIN_PASSWORD='keycloak1!' \
          quay.io/keycloak/keycloak:26.5.6 start-dev --health-enabled=true
    - name: Checkout
      uses: actions/checkout@v6
    - name: Java setup
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: temurin
        cache: maven
    - name: Wait for Keycloak to be ready
      run: |
        echo "Waiting for Keycloak to be ready..."
        timeout 120 bash -c 'until curl -f http://localhost:9000/health/ready; do sleep 2; done'
    - name: Keycloak logs (debug)
      if: failure()
      run: docker logs keycloak
    - name: Run Maven
      env:
        KEYCLOAK_URL: http://localhost:8080/
        KEYCLOAK_USER: keycloak
        KEYCLOAK_PASSWORD: keycloak1!
        KEYCLOAK_ENFORCE_SUBGROUPS_IN_GROUP_QUERY: true
      run: mvn -B clean install
    - name: Upload Surefire Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: |
          **/target/surefire-reports/*.txt
          **/target/surefire-reports/*.xml
          **/target/keycloak-init-error.txt
        if-no-files-found: ignore
        retention-days: 4
